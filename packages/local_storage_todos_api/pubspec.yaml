name: local_storage_todos_api
description: A Flutter implementation of the TodosApi that uses local storage.
version: 0.1.0+1
publish_to: none

environment:
  sdk: ^3.9.0

dependencies:
  todos_api:
    path: ../todos_api
  shared_preferences: ^2.5.3
  json_annotation: ^4.9.0
  meta: ^1.16.0
  rxdart: ^0.28.0

dev_dependencies:
  build_runner: ^2.4.9
  json_serializable: ^6.8.0
  mocktail: ^1.0.4
  test: ^1.26.3
  very_good_analysis: ^10.0.0